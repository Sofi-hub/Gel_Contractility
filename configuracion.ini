; Valores con los que arranca la ventana (Analizar.bat) y procesar_carpeta.py.
; Se edita con el Bloc de notas. Si este archivo no esta, se usan los de abajo.
; A proposito NO hay parametros del analisis (umbral, ROI, ventanas): esos se
; validaron con la regresion y no se cambian desde aca.

[ventana]
; Frecuencia del estimulador en Hz (vacio = no se sabe; ej: 0.1  o  0.1 0.2)
frecuencia =
; Pasos marcados al abrir: 1 medir, 2 contracciones, 3 confirmar, 4 informe
pasos = 1 2 4
; Mostrar el detalle tecnico (--verbose): si / no
detalle = no
; Carpeta de resultados por defecto (vacio = data\processed_data)
carpeta_resultados =
